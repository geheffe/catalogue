<script>
/////////////////////////\\\\\\\  Menu   \\\\\\\///////////////////////////////////

document.addEventListener('DOMContentLoaded', function() {
    const hamburger = document.querySelector('.hamburger-menu');
    const menu = document.querySelector('.site-menu');
    const closeBtn = document.querySelector('.close-menu');
    
    // Gestion du menu hamburger
    hamburger.addEventListener('click', function(e) {
        e.stopPropagation();
        menu.classList.toggle('show');
        closeBtn.style.display = menu.classList.contains('show') ? 'block' : 'none';
    });
    
    // Gestion de la fermeture
    closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        menu.classList.remove('show');
        this.style.display = 'none';
    });

  
    // Gestion des sous-menus mobile
    document.querySelectorAll('.site-menu li.has-submenu > a').forEach(link => {
    link.addEventListener('click', function(e) {
        if (window.innerWidth <= 768) {
            e.preventDefault();
            const parentLi = this.parentElement;
            const submenu = parentLi.querySelector('.submenu');
            const wasOpen = parentLi.classList.contains('opened');
            
            // Fermer tous les autres sous-menus d'abord
            document.querySelectorAll('.site-menu li.has-submenu').forEach(li => {
                if (li !== parentLi) {
                    li.classList.remove('opened');
                    li.querySelector('.submenu')?.classList.remove('mobile-show');
                }
            });
            
            // Basculer l'état actuel
            if (wasOpen) {
                // Fermer si déjà ouvert
                parentLi.classList.remove('opened');
                submenu.classList.remove('mobile-show');
            } else {
                // Ouvrir si fermé
                parentLi.classList.add('opened');
                submenu.classList.add('mobile-show');
            }
            
            // Debug
            console.log('État du menu:', {
                élément: parentLi,
                ouvert: parentLi.classList.contains('opened'),
                sousMenuVisible: submenu.classList.contains('mobile-show')
            });
        }
    });
});
      
    
    
});


/////////////////////////\\\\\  fin de Menu  \\\/////////////////////////////////

/////////////////////////\\\\\\ Zoom      \\\\\\/////////////////////////////////
//////////////////// ZOOM PROGRESSIF À LA MOLETTE + DRAG ////////////////////////

//console.log('🔍 Script zoom chargé');

// Double-clic pour recentrer
document.addEventListener('dblclick', function(e) {
    if (!lightboxIsOpen()) return;
    const img = e.target.closest('.mfp-img');
    if (!img) return;
    e.preventDefault();
    e.stopPropagation();
    resetZoom(img);
    updateZoomButtons();
}, true);

// BLOQUER LE CLIC SUR L'IMAGE (filet de sécurité en phase capture)
// On exclut explicitement : bouton fermer, chevrons, et autres contrôles
document.addEventListener('click', function(e) {
    // Si c'est un contrôle Magnific, on laisse passer
    if (e.target.closest('.mfp-close') ||
        e.target.closest('.mfp-arrow') ||
        e.target.closest('.mfp-counter') ||
        e.target.closest('.mfp-preloader')) {
        return;
    }
    
    // Si c'est l'image (ou son conteneur figure), on bloque
    if ((e.target.closest('.mfp-img') || e.target.closest('.mfp-figure'))
        && document.querySelector('.mfp-wrap.mfp-ready')) {
        e.stopPropagation();
        e.stopImmediatePropagation();
        e.preventDefault();
//        console.log('⛔ Clic sur image bloqué (avant Magnific)');
        return false;
    }
}, true);


// Détection mobile
const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

function showZoomHint() {
    if (document.getElementById('zoom-hint')) return;
    
    const hint = document.createElement('div');
    hint.id = 'zoom-hint';
    hint.textContent = '🔍 Molette pour zoomer, cliquez pour déplacer';
    document.body.appendChild(hint);
    
    setTimeout(() => {
        hint.classList.add('fade-out');
        setTimeout(() => hint.remove(), 800);
    }, 3000);   // ← remplacez 4000 par 8000 (ou ce que vous voulez)
}


// État
let currentScale = 1;
const MIN_SCALE = 1;
//const MAX_SCALE = 5;
const MAX_SCALE = 4;
const STEP = 0.15;

let isDragging = false;
let hasDragged = false;
let isRealDrag = false;
let dragEndTime = 0;
let startX = 0, startY = 0;
let translateX = 0, translateY = 0;

// Récupérer l'image actuellement zoomable
function getZoomImg() {
    return document.querySelector('.mfp-img');
}

function clampTranslation(img) {
    if (!img) return;
    
    const container = img.closest('.mfp-container');
    if (!container) return;
    
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    const baseW = img.offsetWidth;
    const baseH = img.offsetHeight;
    
    const maxX = Math.max(0, (baseW * currentScale - cw) / 2 / currentScale);
    const maxY = Math.max(0, (baseH * currentScale - ch) / 2 / currentScale);
    
    translateX = Math.min(Math.max(translateX, -maxX), maxX);
    translateY = Math.min(Math.max(translateY, -maxY), maxY);
}

// Appliquer la transformation
function applyTransform(img) {
    if (!img) return;
    clampTranslation(img);
    img.style.transform = `scale(${currentScale}) translate(${translateX}px, ${translateY}px)`;
    img.style.transformOrigin = 'center center';
    updateZoomLevel();       // ← AJOUT
}

// Reset
function resetZoom(img) {
// Ajouter TEMPORAIREMENT dans resetZoom
//    console.log('⚠️ resetZoom appelé !', new Error().stack);
/////////////////////////////////////////
    currentScale = 1;
    translateX = 0;
    translateY = 0;
    // ⚠️ NE PAS toucher isDragging, hasDragged, isRealDrag ici
    if (img) {
        img.style.transform = '';
        img.style.cursor = 'grab';
    }
    updateZoomLevel();       // ← AJOUT
}

function updateZoomButtons() {
    const zin  = document.getElementById('zoom-in');
    const zout = document.getElementById('zoom-out');
    if (!zin || !zout) return;
    zin.disabled  = currentScale >= MAX_SCALE;
    zout.disabled = currentScale <= MIN_SCALE;
}

// --- Boutons + / − ---
function showZoomButtons() {
    if (isMobile) return;                    // pas nécessaire sur mobile (pinch natif)
    if (document.getElementById('zoom-controls')) return;

    const wrap = document.createElement('div');
    wrap.id = 'zoom-controls';
    wrap.innerHTML = `
        <button type="button" id="zoom-in"  title="Zoomer">+</button>
        <button type="button" id="zoom-out" title="Dézoomer">−</button>
    `;
    document.body.appendChild(wrap);

    wrap.querySelector('#zoom-in').addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        zoomByStep(+1);
    });
    wrap.querySelector('#zoom-out').addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        zoomByStep(-1);
    });

    updateZoomButtons();                     // état initial (grisé si à MIN_SCALE)
}

function hideZoomButtons() {
    const el = document.getElementById('zoom-controls');
    if (el) el.remove();
}

// Paliers de zoom pour les boutons + / −
//const ZOOM_STEPS = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5];
const ZOOM_STEPS = [1, 1.25, 1.5, 2, 2.5, 3, 4];

function zoomByStep(direction) {
    const img = getZoomImg();
    if (!img) return;

    let newScale;

    if (direction > 0) {
        // Chercher le premier palier strictement supérieur à currentScale
        newScale = ZOOM_STEPS.find(s => s > currentScale + 0.001);
        if (newScale === undefined) newScale = ZOOM_STEPS[ZOOM_STEPS.length - 1];
    } else {
        // Chercher le premier palier strictement inférieur, en partant de la fin
        const lower = ZOOM_STEPS.filter(s => s < currentScale - 0.001);
        newScale = lower.length ? lower[lower.length - 1] : ZOOM_STEPS[0];
    }

    // Si on redescend à 1, on reset proprement (retire la transformation)
    if (newScale === MIN_SCALE) {
        resetZoom(img);
        updateZoomButtons();
        return;
    }

    currentScale = newScale;
    applyTransform(img);
    updateZoomButtons();
}

function showZoomLevel() {
    if (isMobile) return;
    if (document.getElementById('zoom-level')) return;
    
    const el = document.createElement('div');
    el.id = 'zoom-level';
    el.textContent = '100 %';
    document.body.appendChild(el);
}

function hideZoomLevel() {
    const el = document.getElementById('zoom-level');
    if (el) el.remove();
}

function updateZoomLevel() {
    const el = document.getElementById('zoom-level');
    if (!el) return;
    el.textContent = Math.round(currentScale * 100) + ' %';
}

// Vérifier si une lightbox est ouverte
function lightboxIsOpen() {
    return document.querySelector('.mfp-wrap.mfp-ready') !== null;
}

// ZOOM À LA MOLETTE
document.addEventListener('wheel', function(e) {
    if (!lightboxIsOpen()) return;
    const img = e.target.closest('.mfp-img');
    if (!img) return;
    
    e.preventDefault();
    e.stopPropagation();
    
    const delta = e.deltaY > 0 ? -STEP : STEP;
    let newScale = currentScale + delta;
    newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);
    
    if (newScale === MIN_SCALE) {
        resetZoom(img);
        updateZoomButtons();          // ← AJOUT
        return;
    }
    
    currentScale = newScale;
    applyTransform(img);
    updateZoomButtons();              // ← AJOUT
}, { passive: false, capture: true });

// DRAG - mousedown (bouton gauche uniquement)
document.addEventListener('mousedown', function(e) {
    if (isMobile) return;
    if (e.button !== 0) return;              // ← bouton gauche seulement
    if (!lightboxIsOpen()) return;
    if (currentScale <= 1) return;           // pas de drag si pas zoomé
    
    const img = e.target.closest('.mfp-img');
    if (!img) return;
    
    e.preventDefault();                       // ← empêche la sélection/fermeture
    e.stopPropagation();
    
    isDragging = true;
    hasDragged = false;
    startX = e.clientX - translateX;
    startY = e.clientY - translateY;
    img.style.cursor = 'grabbing';
});

// DRAG - mousemove (tant que le bouton est maintenu)
document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    const img = getZoomImg();
    if (!img) return;
    
    e.preventDefault();
    
    // Détection du vrai drag (pour ne pas déclencher sur un simple clic)
    if (!hasDragged) {
        const dist = Math.abs(e.clientX - (startX + translateX)) +
                     Math.abs(e.clientY - (startY + translateY));
        if (dist > 3) {
            hasDragged = true;
        }
    }
    if (!hasDragged) return;
    
    const rawX = e.clientX - startX;
    const rawY = e.clientY - startY;
    
    const container = img.closest('.mfp-container');
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    const maxX = Math.max(0, (img.offsetWidth  * currentScale - cw) / 2 / currentScale);
    const maxY = Math.max(0, (img.offsetHeight * currentScale - ch) / 2 / currentScale);
    
    translateX = Math.min(Math.max(rawX, -maxX), maxX);
    translateY = Math.min(Math.max(rawY, -maxY), maxY);
    applyTransform(img);
});

// DRAG - mouseup (relachement = on pose l'image)
document.addEventListener('mouseup', function(e) {
    if (!isDragging) return;
    isDragging = false;
    
    const img = getZoomImg();
    if (img) img.style.cursor = 'grab';
    
    // Mémoriser l'instant pour bloquer un éventuel click parasite
    if (hasDragged) {
        dragEndTime = Date.now();
    }
    hasDragged = false;
}, { capture: true });

// Bloquer le clic sur l'image UNIQUEMENT s'il vient après un drag
document.addEventListener('click', function(e) {
    // Contrôles Magnific : on laisse passer
    if (e.target.closest('.mfp-close') ||
        e.target.closest('.mfp-arrow') ||
        e.target.closest('.mfp-counter') ||
        e.target.closest('.mfp-preloader')) {
        return;
    }
    
    const onImage = (e.target.closest('.mfp-img') || e.target.closest('.mfp-figure'))
                    && document.querySelector('.mfp-wrap.mfp-ready');
    
    if (onImage) {
        // Si un drag vient de se terminer (< 300 ms), on bloque le clic
        if (Date.now() - dragEndTime < 300) {
            e.stopPropagation();
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
        }
        // Sinon (clic simple sans drag) : on laisse passer → Magnific ferme la lightbox
    }
}, true);

// Nettoyage quand la lightbox change/ferme
document.addEventListener('mfpChange', function() {
    isRealDrag = false;
    hasDragged = false;
    setTimeout(() => {
        const img = getZoomImg();
        if (img) resetZoom(img);
    }, 50);
});


// Afficher l'indicateur + les boutons à l'ouverture de la lightbox
document.addEventListener('mfpOpen', function() {
    showZoomHint();
    showZoomButtons();
});

// Initialisation + surveillance des changements d'image
function initObserver() {
    if (!document.body) {
        setTimeout(initObserver, 100);
        return;
    }

    // Garder une référence de l'image actuelle pour détecter les changements
    let lastImgSrc = '';

    // Surveillance en boucle légère (plus fiable que MutationObserver pour ce cas)
    setInterval(() => {
        const img = document.querySelector('.mfp-img');
        const wrap = document.querySelector('.mfp-wrap.mfp-ready');

        // Cas 1 : lightbox ouverte, image présente
        if (wrap && img) {
            const src = img.getAttribute('src') || '';
            
            // Nouvelle image détectée ? → reset complet
            if (src !== lastImgSrc) {
                lastImgSrc = src;
                currentScale = 1;
                translateX = 0;
                translateY = 0;
                isDragging = false;
                isRealDrag = false;
                // Retirer la transformation appliquée à la précédente
                img.style.transform = '';
                img.style.cursor = 'grab';
//                console.log('🔄 Nouvelle image détectée, zoom reset');
                // ← AJOUT : relancer le badge à chaque nouvelle image
                if (!isMobile) {
                    // Supprimer un éventuel badge restant
                    const old = document.getElementById('zoom-hint');
                    if (old) old.remove();
                    // Recréer le badge
                    showZoomHint();
                    showZoomLevel();          // ← AJOUT
                    showZoomButtons();
                    updateZoomButtons();
                    updateZoomLevel();        // ← AJOUT (état initial à 100 %)
                    
                }
            }
        }
        
        // Cas 2 : lightbox fermée → nettoyage
        if (!wrap) {
            if (lastImgSrc !== '') {
                lastImgSrc = '';
                currentScale = 1;
                translateX = 0;
                translateY = 0;
                isDragging = false;
                isRealDrag = false;
                hideZoomButtons();
                hideZoomLevel();          // ← AJOUT
            }
        }
    }, 100);

//    console.log('🔍 Zoom progressif activé' + (isMobile ? ' (mobile)' : ''));
}


// Lancer l'init dès que le DOM est prêt
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initObserver);
} else {
    initObserver();
}
</script>
